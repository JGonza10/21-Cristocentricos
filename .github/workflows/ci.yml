name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg (para la prueba de reels de punta a punta)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Pruebas (pytest)
        run: pytest
      - name: Dependencias vulnerables (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        shell: bash
        run: |
          set -o pipefail
          node -v; npm -v
          if ! npm ci 2>&1 | tee npm-ci.log; then
            echo "::error title=npm ci::$(grep -E 'npm (ERR|error)' npm-ci.log | head -8 | tr '\n' ' ')"
            exit 1
          fi
      - name: Dependencias vulnerables (npm audit)
        run: npm audit --audit-level=high
      - name: Compilar
        run: npm run build
